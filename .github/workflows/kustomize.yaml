---
name: "Kustomize GitHub Actions"
on: # yamllint disable-line rule:truthy
  - pull_request
jobs:
  kustomize:
    name: "Kustomize"
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - uses: syntaqx/setup-kustomize@v1
        with:
          # renovate: datasource=github-tags depName=kubernetes-sigs/kustomize extractVersion="^kustomize/v(?<version>.*)$" versioning=semver-coerced
          kustomize-version: 5.8.1
      - uses: azure/setup-helm@v5
        with:
          version: 4.3.1
          token: ${{ github.token }}
        id: install
      - name: arduino/setup-task
        uses: arduino/setup-task@v3.0.0
        with:
          version: ${{ vars.TASK_VERSION}}
          repo-token: ${{ github.token }}
      - name: Kustomize Version
        run: kustomize version
      - name: Helm version
        run: helm version
      - name: Authenticate Helm to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry.json
        run: |
          mkdir -p "$(dirname "$HELM_REGISTRY_CONFIG")"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin
      - name: Kustomize It!
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry.json
        run: task build:kustomize
