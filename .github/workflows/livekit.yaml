---
name: LiveKit
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - ansible/roles/livekit/**
  pull_request:
    branches:
      - main
    paths:
      - ansible/roles/livekit/**
jobs:
  check:
    if: github.secret_source != 'Dependabot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: ansible/roles/livekit/**
    outputs:
      execute: ${{ steps.changed-files.outputs.all_changed_files_count > 0 }}
  molecule:
    needs: check
    if: needs.check.outputs.execute == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install molecule molecule-plugins[docker] ansible-core ansible-lint
      - name: Run Molecule tests
        run: molecule test
        working-directory: ansible/roles/livekit
