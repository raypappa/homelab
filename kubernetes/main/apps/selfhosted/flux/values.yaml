---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/values.schema.json

# Flux: self-hosted kanban board.

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: sirsjg/flux-mcp
          # Pin a concrete tag; see Docker Hub tags (latest = most recent build).
          tag: sha-4d77f4f
          pullPolicy: IfNotPresent
        env:
          - name: FLUX_DATA
            value: /app/packages/data/flux.sqlite
          - name: FLUX_ALLOW_ANONYMOUS
            value: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    type: deployment

service:
  main:
    controller: main
    ports:
      http:
        port: 80

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: flux-data-dst
    size: 1Gi
    globalMounts:
      - path: /app/packages/data
