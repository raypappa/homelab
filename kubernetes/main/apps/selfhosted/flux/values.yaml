---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/values.schema.json

# Flux: self-hosted kanban board.

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: sirsjg/flux-mcp
          # Pin a concrete tag; see Docker Hub tags (latest = most recent build).
          tag: sha-4d77f4f
          pullPolicy: IfNotPresent
        env:
          - name: FLUX_DATA
            value: /app/packages/data/flux.sqlite
          - name: FLUX_ALLOW_ANONYMOUS
            value: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      tls-proxy:
        image:
          repository: docker.io/nginx/nginx-unprivileged
          # renovate: datasource=docker depName=nginx/nginx-unprivileged
          tag: 1.31.8
          digest: sha256:ea4fd7ab5a8dc6348c18240bd3546f355f8373cd8f112580f7d8bd8ff5a74772
          pullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
    type: deployment

service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: metalpool
      external-dns.kubernetes.io/hostname: flux.internal.stoneydavis.com,flux.stoneydavis.internal
      external-dns.kubernetes.io/ttl: "1800"
      external-dns.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 80
        targetPort: 3000
      https:
        port: 443
        targetPort: 8443

persistence:
  data:
    type: persistentVolumeClaim
    forceRename: flux
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: flux-data-dst
    size: 1Gi
    advancedMounts:
      main:
        app:
          - path: /app/packages/data
  home:
    type: persistentVolumeClaim
    forceRename: flux-home
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: flux-home-dst
    size: 1Gi
    advancedMounts:
      main:
        app:
          - path: /home/flux
  tls-proxy-config:
    enabled: true
    type: configMap
    name: flux-tls-proxy-config
    advancedMounts:
      main:
        tls-proxy:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
  flux-internal-tls:
    enabled: true
    type: secret
    name: flux-internal-stoneydavis-com-tls
    advancedMounts:
      main:
        tls-proxy:
          - path: /etc/nginx/certs
            readOnly: true
  tls-proxy-tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 64Mi
    advancedMounts:
      main:
        tls-proxy:
          - path: /tmp
