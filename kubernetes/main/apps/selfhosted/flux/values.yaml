---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/values.schema.json

# Flux: self-hosted kanban board (open source, MCP-capable).
# The Flux *server* is deployed by the chart; the MCP server is bundled
# alongside it as a sidecar container, so a single Deployment serves both
# and shares the same data PersistentVolumeClaim.

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: sirsjg/flux-mcp
          # Pin a concrete tag; see Docker Hub tags (latest = most recent build).
          tag: sha-4d77f4f
          pullPolicy: IfNotPresent
        env:
          - name: FLUX_DATA
            value: /app/packages/data/flux.sqlite
          - name: FLUX_ALLOW_ANONYMOUS
            value: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      mcp:
        image:
          repository: sirsjg/flux-mcp
          tag: sha-4d77f4f
          pullPolicy: IfNotPresent
        command:
          - "bun"
          - "packages/mcp/dist/index.js"
        args:
          - "--http"
          - "--port=3001"
        env:
          - name: FLUX_DATA
            value: /app/packages/data/flux.sqlite
          - name: FLUX_MCP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: flux-mcp
                key: mcp-password
        ports:
          - name: mcp
            containerPort: 3001
    type: deployment

service:
  main:
    controller: main
    ports:
      http:
        port: 80
  mcp:
    controller: main
    ports:
      http:
        port: 3001

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/packages/data
