apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-mcp
  namespace: flux
  labels:
    app: flux-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-mcp
  template:
    metadata:
      labels:
        app: flux-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: sirsjg/flux-mcp:sha-4d77f4f
          command: ["bun", "packages/mcp/dist/index.js"]
          args: ["--http", "--port=3001"]
          env:
            - name: FLUX_DATA
              value: /app/packages/data/flux.sqlite
            - name: FLUX_MCP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flux-secrets
                  key: mcp-password
          ports:
            - name: mcp
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/packages/data
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: flux
