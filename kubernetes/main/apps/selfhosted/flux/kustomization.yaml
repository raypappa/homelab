---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    version: 5.3.0
    namespace: flux
    releaseName: flux
    valuesFile: values.yaml
  - name: cloudflare-tunnel
    repo: https://cloudflare.github.io/helm-charts
    version: 0.3.2
    namespace: flux
    releaseName: flux
    valuesFile: cloudflare-values.yaml
configMapGenerator:
  - name: flux-tls-proxy-config
    files:
      - default.conf=tls-proxy.conf
    options:
      disableNameSuffixHash: true
resources:
  - ./internal-certificate.yaml
  - ./base/external-secret.yaml
  - ./base/volsync-external-secret.yaml
  - ./base/volsync-replication-destination.yaml
  - ./base/volsync-replication-source.yaml
