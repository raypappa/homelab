---
image:
  # renovate: datasource=docker depName=cloudflare/cloudflared
  tag: 2026.11.0
cloudflare:
  secretName: "timetagger-tunnel-credentials"
  tunnelName: "faerun-timetagger"
  ingress:
    - hostname: "timetagger.fieldsofbears.com"
      service: "https://timetagger.timetagger.svc.cluster.local:443"
      originRequest:
        originServerName: "timetagger.internal.stoneydavis.com"
        noTLSVerify: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: "RuntimeDefault"
