---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/values.schema.json
defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  timetagger:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        image:
          repository: ghcr.io/almarklein/timetagger
          # renovate: datasource=docker depName=ghcr.io/almarklein/timetagger
          tag: v26.1.3-nonroot
          pullPolicy: IfNotPresent
        env:
          TIMETAGGER_BIND: 0.0.0.0:80
          TIMETAGGER_DATADIR: /config
          TIMETAGGER_LOG_LEVEL: info
          TIMETAGGER_CREDENTIALS:
            valueFrom:
              secretKeyRef:
                name: timetagger-credentials
                key: credentials
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 18m
            memory: 128Mi
          limits:
            memory: 256Mi
      tls-proxy:
        image:
          repository: docker.io/nginx/nginx-unprivileged
          # renovate: datasource=docker depName=nginx/nginx-unprivileged
          tag: 1.31.8
          digest: sha256:ea4fd7ab5a8dc6348c18240bd3546f355f8373cd8f112580f7d8bd8ff5a74772
          pullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  app:
    controller: timetagger
    ports:
      http:
        port: 80
      https:
        port: 443
        targetPort: 8443
    type: LoadBalancer
    annotations:
      external-dns.kubernetes.io/hostname: timetagger.internal.stoneydavis.com,timetagger.stoneydavis.internal
      external-dns.kubernetes.io/ttl: "1800"
      external-dns.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
persistence:
  config:
    enabled: true
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: timetagger-config-dst
    size: 5Gi
    advancedMounts:
      timetagger:
        app:
          - path: /config
  tmp:
    type: emptyDir
    advancedMounts:
      timetagger:
        app:
          - path: /tmp
  tls-proxy-config:
    enabled: true
    type: configMap
    name: timetagger-tls-proxy-config
    advancedMounts:
      timetagger:
        tls-proxy:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
  timetagger-internal-tls:
    enabled: true
    type: secret
    name: timetagger-internal-stoneydavis-com-tls
    advancedMounts:
      timetagger:
        tls-proxy:
          - path: /etc/nginx/certs
            readOnly: true
  tls-proxy-tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 64Mi
    advancedMounts:
      timetagger:
        tls-proxy:
          - path: /tmp
