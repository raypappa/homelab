---
localpv-provisioner:
  rbac:
    create: true
  localpv:
    image:
      registry: quay.io/
      repository: openebs/provisioner-localpv
    tolerations:
      - key: dedicated
        operator: Equal
        value: gpu
        effect: NoExecute
  hostpathClass:
    enabled: true
    name: openebs-hostpath
    isDefaultClass: false
    basePath: /var/mnt/sata/openebs/local
loki:
  minio:
    mcImage:
      repository: docker.io/openebs/mc
      tag: RELEASE.2024-11-21T17-21-54Z
openebs-crds:
  csi:
    volumeSnapshots:
      enabled: false
      keep: false
zfs-localpv:
  enabled: false
lvm-localpv:
  enabled: false
mayastor:
  enabled: false
engines:
  local:
    lvm:
      enabled: false
    zfs:
      enabled: false
  replicated:
    mayastor:
      enabled: false
