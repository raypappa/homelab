---
controller:
  replicas: 1
  dnsPolicy: Default
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoExecute
storageClasses:
  - name: nfs-ip
    parameters:
      server: 10.49.49.140
      share: /library
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.2
  - name: nfs
    # StorageClass parameters are immutable; force a recreate to update them.
    annotations:
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    parameters:
      server: storage-0001.internal.stoneydavis.com
      share: /library
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.2

node:
  dnsPolicy: Default
  tolerations:
    - operator: Exists
