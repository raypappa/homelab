---
image:
  # renovate: datasource=docker depName=cloudflare/cloudflared
  tag: 2025.11.1
cloudflare:
  secretName: "jellyfin-tunnel-credentials"
  tunnelName: "faerun-jellyfin"
  ingress:
    - hostname: "jellyfin.fieldsofbears.com"
      service: "https://jellyfin.jellyfin.svc.cluster.local:443"
      originRequest:
        originServerName: "jellyfin.internal.stoneydavis.com"
        noTLSVerify: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: "RuntimeDefault"
