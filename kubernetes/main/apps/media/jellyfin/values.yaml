---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        # supplementalGroups:
        #   - 44
        #   - 105
    containers:
      app:
        image:
          repository: docker.io/jellyfin/jellyfin
          # renovate: datasource=docker depName=docker.io/jellyfin/jellyfin
          tag: "10.11.11"
        env:
          TZ: "UTC"
          JELLYFIN_CACHE_DIR: "/config/cache"
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
            # supplementalGroups:
            #   #   # Hardware acceleration using an Intel iGPU w/ QuickSync
            #   #   # These IDs below should be matched to your `video` and `render` group on the host
            #   #   # To obtain those IDs run the following grep statement on the host:
            #   #   # $ cat /etc/group | grep "video\|render"
            #   - 44
            #   - 105
        resources:
          requests:
            # gpu.intel.com/i915: 1
            cpu: 500m
            memory: 1000Mi
          limits:
            # gpu.intel.com/i915: 1
            memory: 8000Mi
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=jellyfin"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
          TS_SERVE_CONFIG: "/etc/tailscale/serve-config.json"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
      tls-proxy:
        image:
          repository: docker.io/nginx/nginx-unprivileged
          # renovate: datasource=docker depName=nginx/nginx-unprivileged
          tag: 1.31.8
          digest: sha256:ea4fd7ab5a8dc6348c18240bd3546f355f8373cd8f112580f7d8bd8ff5a74772
          pullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
persistence:
  config:
    enabled: true
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: jellyfin-config-dst
    size: 50Gi
    advancedMounts:
      main:
        app:
          - path: /config
  tmp-jellyfin:
    enabled: true
    type: emptyDir
    sizeLimit: 5Gi
    advancedMounts:
      main:
        app:
          - path: /tmp/jellyfin
  transcode:
    enabled: true
    type: emptyDir
    sizeLimit: 10Gi
    advancedMounts:
      main:
        app:
          - path: /config/cache/transcodes
  library:
    enabled: true
    existingClaim: jellyfin-library-nfs
    advancedMounts:
      main:
        app:
          - path: /library
            readOnly: true
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      main:
        tailscale:
          - path: /tmp/tailscale
  tailscale-serve-config:
    enabled: true
    type: configMap
    name: tailscale-serve
    advancedMounts:
      main:
        tailscale:
          - path: /etc/tailscale
            readOnly: true
  tls-proxy-config:
    enabled: true
    type: configMap
    name: jellyfin-tls-proxy-config
    advancedMounts:
      main:
        tls-proxy:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
  jellyfin-internal-tls:
    enabled: true
    type: secret
    name: jellyfin-internal-stoneydavis-com-tls
    advancedMounts:
      main:
        tls-proxy:
          - path: /etc/nginx/certs
            readOnly: true
  tls-proxy-tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 64Mi
    advancedMounts:
      main:
        tls-proxy:
          - path: /tmp
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      external-dns.kubernetes.io/hostname: jellyfin.internal.stoneydavis.com,jellyfin.stoneydavis.internal
      external-dns.kubernetes.io/ttl: "1800"
      external-dns.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 80
        targetPort: 8096
      https:
        port: 443
        targetPort: 8443
