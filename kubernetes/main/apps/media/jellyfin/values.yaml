---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        # supplementalGroups:
        #   - 44
        #   - 105
    containers:
      app:
        image:
          repository: docker.io/jellyfin/jellyfin
          # renovate: datasource=docker depName=docker.io/jellyfin/jellyfin
          tag: "10.11.11"
        env:
          TZ: "UTC"
          JELLYFIN_CACHE_DIR: "/config/cache"
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
            # supplementalGroups:
            #   #   # Hardware acceleration using an Intel iGPU w/ QuickSync
            #   #   # These IDs below should be matched to your `video` and `render` group on the host
            #   #   # To obtain those IDs run the following grep statement on the host:
            #   #   # $ cat /etc/group | grep "video\|render"
            #   - 44
            #   - 105
        resources:
          requests:
            # gpu.intel.com/i915: 1
            cpu: 500m
            memory: 1000Mi
          limits:
            # gpu.intel.com/i915: 1
            memory: 8000Mi
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=jellyfin"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
          TS_SERVE_CONFIG: "/etc/tailscale/serve-config.json"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
persistence:
  config:
    enabled: true
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: jellyfin-config-dst
    size: 50Gi
    advancedMounts:
      main:
        app:
          - path: /config
  tmp-jellyfin:
    enabled: true
    type: emptyDir
    sizeLimit: 5Gi
    advancedMounts:
      main:
        app:
          - path: /tmp/jellyfin
  transcode:
    enabled: true
    type: emptyDir
    sizeLimit: 10Gi
    advancedMounts:
      main:
        app:
          - path: /config/cache/transcodes
  library:
    enabled: true
    existingClaim: jellyfin-library-nfs
    advancedMounts:
      main:
        app:
          - path: /library
            readOnly: true
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      main:
        tailscale:
          - path: /tmp/tailscale
  tailscale-serve-config:
    enabled: true
    type: configMap
    name: tailscale-serve
    advancedMounts:
      main:
        tailscale:
          - path: /etc/tailscale
            readOnly: true
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      external-dns.kubernetes.io/hostname: jellyfin.internal.stoneydavis.com,jellyfin.stoneydavis.internal
      external-dns.kubernetes.io/ttl: "1800"
      external-dns.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 80
        targetPort: 8096
