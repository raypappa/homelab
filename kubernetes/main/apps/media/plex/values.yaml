---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/values.schema.json
controllers:
  plex:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups:
          - 44
          - 109
          - 65542 # gladius:external-services
      nodeSelector:
        kubernetes.io/hostname: puma
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/plex
          # renovate: datasource=docker depName=ghcr.io/home-operations/plex
          tag: 1.43.3
        env:
          PLEX_NO_AUTH_NETWORKS: 172.17.42.0/24
          TZ: UTC
          PLEX_ADVERTISE_URL: http://172.17.42.200:32400,https://potato.fieldsofbears.com:443
          ADVERTISE_IP: 172.17.42.200
          PLEX_CLAIM:
            valueFrom:
              secretKeyRef:
                name: plex-secret
                key: PLEX_CLAIM
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /identity
                port: 32400
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=plex"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
          TS_SERVE_CONFIG: "/etc/tailscale/serve-config.json"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
service:
  app:
    controller: plex
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: 172.17.42.200
      metallb.universe.tf/address-pool: metalpool
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 32400
persistence:
  config:
    existingClaim: plex-config
    advancedMounts:
      plex:
        app:
          - path: /config
  plex-cache:
    existingClaim: plex-cache
    advancedMounts:
      plex:
        app:
          - path: /config/Library/Application Support/Plex Media Server/Cache
  logs:
    type: emptyDir
    advancedMounts:
      plex:
        app:
          - path: /config/Library/Application Support/Plex Media Server/Logs
  # TODO: Once the switch is upgraded switch to nfs.
  library:
    enabled: true
    type: hostPath
    hostPathType: Directory
    hostPath: /library
    advancedMounts:
      plex:
        app:
          - path: /library
            readOnly: true
  transcode:
    type: emptyDir
    advancedMounts:
      plex:
        app:
          - path: /transcode
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      plex:
        tailscale:
          - path: /tmp/tailscale
  tailscale-serve-config:
    enabled: true
    type: configMap
    name: tailscale-serve
    advancedMounts:
      plex:
        tailscale:
          - path: /etc/tailscale
            readOnly: true
