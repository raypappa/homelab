---
image:
  # renovate: datasource=docker depName=cloudflare/cloudflared
  tag: 2025.11.1
cloudflare:
  secretName: "spotizerr-tunnel-credentials"
  tunnelName: "faerun-spotizerr"
  ingress:
    - hostname: "spotizerr.fieldsofbears.com"
      service: "https://spotizerr.spotizerr.svc.cluster.local:443"
      originRequest:
        originServerName: "spotizerr.internal.stoneydavis.com"
        noTLSVerify: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: "RuntimeDefault"
