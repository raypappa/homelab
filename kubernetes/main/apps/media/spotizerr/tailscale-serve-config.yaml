---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-serve
  namespace: spotizerr
data:
  serve-config.json: |-
    {
      "TCP": {"443": {"HTTPS": true}},
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {"/": {"Proxy": "http://127.0.0.1:7171"}}
        }
      },
      "AllowFunnel": {"${TS_CERT_DOMAIN}:443": false}
    }
