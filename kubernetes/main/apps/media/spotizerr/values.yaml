---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  spotizerr:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
    strategy: RollingUpdate
    containers:
      app:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        image:
          repository: spotizerrphoenix/spotizerr
          # renovate: datasource=docker depName=spotizerrphoenix/spotizerr
          tag: "4.0.17"
        env:
          PUID: "1001"
          PGID: "1001"
          REDIS_HOST: dragonfly.database.svc.cluster.local
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          DEFAULT_ADMIN_USERNAME:
            valueFrom:
              secretKeyRef:
                name: spotizerr-admin
                key: username
          DEFAULT_ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: spotizerr-admin
                key: password
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=spotizerr"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
          TS_SERVE_CONFIG: "/etc/tailscale/serve-config.json"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
service:
  spotizerr:
    controller: spotizerr
    type: LoadBalancer
    annotations:
      external-dns.kubernetes.io/hostname: spotizerr.internal.stoneydavis.com,spotizerr.stoneydavis.internal
      external-dns.kubernetes.io/ttl: "1800"
      external-dns.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
    ports:
      http:
        targetPort: 7171
        port: 80
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      spotizerr:
        app:
          - path: /app/config
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: spotizerr-config-dst
  progress:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      spotizerr:
        app:
          - path: /app/prgs
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: spotizerr-progress-dst
  downloads:
    enabled: true
    existingClaim: spotizerr-library-downloads-nfs
    advancedMounts:
      spotizerr:
        app:
          - path: /app/downloads
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      spotizerr:
        app:
          - path: /app/data
    dataSourceRef:
      kind: ReplicationDestination
      apiGroup: volsync.backube
      name: spotizerr-data-dst
  logs:
    type: emptyDir
    advancedMounts:
      spotizerr:
        app:
          - path: /app/logs
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      spotizerr:
        tailscale:
          - path: /tmp/tailscale
  tailscale-serve-config:
    enabled: true
    type: configMap
    name: tailscale-serve
    advancedMounts:
      spotizerr:
        tailscale:
          - path: /etc/tailscale
            readOnly: true
