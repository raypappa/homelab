---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Resources declare their own namespaces; the health-check Role targets argocd.
resources:
  - ./service-account.yaml
  - ./cluster-role.yaml
  - ./cluster-role-binding.yaml
  - ./argocd-application-reader-role.yaml
  - ./argocd-application-reader-rolebinding.yaml
  - ./monitoring-reader-role.yaml
  - ./monitoring-reader-rolebinding.yaml
  - ./grafana-viewer-token-reader-role.yaml
  - ./grafana-viewer-token-reader-rolebinding.yaml
  - ./bootstrap-token.yaml
  - ./push-secret.yaml
