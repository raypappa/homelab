---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sasha-monitoring-reader
  namespace: monitoring
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - prometheuses
      - servicemonitors
      - podmonitors
      - scrapeconfigs
      - prometheusrules
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - prometheus-query-proxy
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - grafana-query-proxy
    verbs:
      - get
      - create
