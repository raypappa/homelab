---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1_secret.json
apiVersion: v1
kind: Secret
metadata:
  name: sasha-token
  namespace: sasha
  labels:
    app.kubernetes.io/name: sasha
    app.kubernetes.io/component: agent-identity
  annotations:
    kubernetes.io/service-account.name: sasha
# Legacy ServiceAccount token Secret. Kubernetes fills `data.token`, `data.ca.crt`,
# and `data.namespace` for this type. It does not expire or rotate automatically;
# delete/recreate this Secret to rotate the credential. ESO mirrors `data.token`
# to 1Password on its hourly refresh. No token value is stored in Git.
type: kubernetes.io/service-account-token
