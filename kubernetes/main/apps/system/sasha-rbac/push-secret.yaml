---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sasha-token
  namespace: sasha
  labels:
    app.kubernetes.io/name: sasha
    app.kubernetes.io/component: agent-identity
# Pushes the legacy ServiceAccount token to the existing onepassword-connect
# vault as item `sasha-kubectl`, property `token`. ESO refreshes this hourly;
# the token is long-lived and is not automatically rotated.
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-connect
  selector:
    secret:
      name: sasha-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: sasha-kubectl
          property: token
