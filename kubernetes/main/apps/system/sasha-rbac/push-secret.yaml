---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/pushsecret_v1.json
apiVersion: external-secrets.io/v1
kind: PushSecret
metadata:
  name: sasha-token
  namespace: sasha
  labels:
    app.kubernetes.io/name: sasha
    app.kubernetes.io/component: agent-identity
# Pushes the agent's ServiceAccount token to a 1Password item
# (sasha-kubectl/token) in the cluster's onepassword-connect vault, so the
# token can be consumed anywhere with `op` without kubectl access. When the
# ServiceAccountTokenRotation renews the sasha-token secret, ESO re-syncs
# this on every refresh and updates the same item (updatePolicy default
# Always). Items must have unique label names for updates to work.
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-connect
  selector:
    secret:
      name: sasha-token
  data:
    - match:
        secretKey: kubernetes.io/service-account-token
      remoteRef:
        remoteKey: sasha-kubectl
        property: token
