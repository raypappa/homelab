---
image:
  # renovate: datasource=docker depName=cloudflare/cloudflared
  tag: 2026.11.1
cloudflare:
  secretName: "prowlarr-tunnel-credentials"
  tunnelName: "faerun-prowlarr"
  ingress:
    - hostname: "prowlarr.fieldsofbears.com"
      service: "https://prowlarr.prowlarr.svc.cluster.local:443"
      originRequest:
        originServerName: "prowlarr.internal.stoneydavis.com"
        noTLSVerify: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: "RuntimeDefault"
