---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-serve
  namespace: prowlarr
data:
  serve-config.json: |-
    {
      "TCP": {"443": {"HTTPS": true}},
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {"/": {"Proxy": "https://prowlarr.internal.stoneydavis.com"}}
        }
      },
      "AllowFunnel": {"${TS_CERT_DOMAIN}:443": false}
    }
