---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    containers:
      main:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        image:
          repository: ghcr.io/home-operations/radarr
          # renovate: datasource=docker depName=ghcr.io/home-operations/radarr
          tag: 6.2.0
          pullPolicy: IfNotPresent
        env:
          COMPlus_EnableDiagnostics: "0"
          RADARR__APP__INSTANCENAME: Radarr
          RADARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: radarr-secret
                key: api_key
          RADARR__AUTH__METHOD: External
          RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
          RADARR__LOG__LEVEL: info
          RADARR__SERVER__PORT: &port 9696
          RADARR__UPDATE__BRANCH: develop
          TZ: UTC
          PUID: 1001
          PGID: 1001
          UMASK: "022"
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.98.8
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=radarr
            --ephemeral"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.universe.tf/address-pool: metalpool
      external-dns.alpha.kubernetes.io/hostname: radarr.stoneydavis.local
      external-dns.alpha.kubernetes.io/ttl: "1800"
      external-dns.alpha.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.alpha.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.alpha.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 80
        targetPort: *port
persistence:
  config:
    enabled: true
    storageClass: ceph-filesystem
    accessMode: ReadWriteOnce
    size: 20Gi
  library:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: radarr-library-nfs
  tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      main:
        main:
          - path: /tmp
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      main:
        tailscale:
          - path: /tmp
