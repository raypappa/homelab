---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    containers:
      main:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        image:
          repository: ghcr.io/home-operations/radarr
          # renovate: datasource=docker depName=ghcr.io/home-operations/radarr
          tag: 6.4.1
          pullPolicy: IfNotPresent
        env:
          COMPlus_EnableDiagnostics: "0"
          RADARR__APP__INSTANCENAME: Radarr
          RADARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: radarr-secret
                key: api_key
          RADARR__AUTH__METHOD: External
          RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
          RADARR__LOG__LEVEL: info
          RADARR__SERVER__PORT: &port 9696
          RADARR__UPDATE__BRANCH: develop
          TZ: UTC
          PUID: 1001
          PGID: 1001
          UMASK: "022"
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=radarr"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
      tls-proxy:
        image:
          repository: docker.io/nginx/nginx-unprivileged
          # renovate: datasource=docker depName=nginx/nginx-unprivileged
          tag: 1.31.8
          digest: sha256:ea4fd7ab5a8dc6348c18240bd3546f355f8373cd8f112580f7d8bd8ff5a74772
          pullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8443
                scheme: HTTPS
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: metalpool
      external-dns.kubernetes.io/hostname: radarr.internal.stoneydavis.com,radarr.stoneydavis.internal
      external-dns.kubernetes.io/ttl: "1800"
      external-dns.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 80
        targetPort: *port
      https:
        port: 443
        targetPort: 8443
persistence:
  config:
    enabled: true
    storageClass: ceph-filesystem
    accessMode: ReadWriteOnce
    size: 20Gi
    advancedMounts:
      main:
        main:
          - path: /config
        tailscale:
          - path: /config
  library:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: radarr-library-nfs
    advancedMounts:
      main:
        main:
          - path: /library
        tailscale:
          - path: /library
  tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      main:
        main:
          - path: /tmp
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      main:
        tailscale:
          - path: /tmp
  tls-proxy-config:
    enabled: true
    type: configMap
    name: radarr-tls-proxy-config
    advancedMounts:
      main:
        tls-proxy:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
  radarr-internal-tls:
    enabled: true
    type: secret
    name: radarr-internal-stoneydavis-com-tls
    advancedMounts:
      main:
        tls-proxy:
          - path: /etc/nginx/certs
            readOnly: true
  tls-proxy-tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 64Mi
    advancedMounts:
      main:
        tls-proxy:
          - path: /tmp
