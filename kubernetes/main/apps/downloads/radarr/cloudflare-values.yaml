---
image:
  # renovate: datasource=docker depName=cloudflare/cloudflared
  tag: 2026.11.0
cloudflare:
  secretName: "radarr-tunnel-credentials"
  tunnelName: "faerun-radarr"
  ingress:
    - hostname: "radarr.fieldsofbears.com"
      service: "https://radarr.radarr.svc.cluster.local:443"
      originRequest:
        originServerName: "radarr.internal.stoneydavis.com"
        noTLSVerify: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: "RuntimeDefault"
