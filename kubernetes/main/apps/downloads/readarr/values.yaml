---
defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    runAsNonRoot: true
    fsGroupChangePolicy: OnRootMismatch
controllers:
  readarr:
    pod:
      nodeSelector:
        kubernetes.io/hostname: puma
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/readarr
          # renovate: datasource=docker depName=ghcr.io/home-operations/readarr
          tag: 0.4.18
          pullPolicy: IfNotPresent
        env:
          COMPlus_EnableDiagnostics: "0"
          READARR__AUTH__METHOD: External
          READARR__AUTH__REQUIRED: DisabledForLocalAddresses
          READARR__INSTANCE_NAME: Readarr
          READARR__PORT: &port 8787
          READARR__LOG_LEVEL: info
          READARR__THEME: light
          READARR__ANALYTICSENABLED: "false"
          READARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: readarr-secret
                key: api_key
          TZ: UTC
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=readarr"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
          TS_SERVE_CONFIG: "/etc/tailscale/serve-config.json"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
service:
  app:
    controller: readarr
    type: LoadBalancer
    annotations:
      metallb.universe.tf/address-pool: metalpool
      external-dns.kubernetes.io/hostname: readarr.internal.stoneydavis.com,readarr.stoneydavis.internal
      external-dns.kubernetes.io/ttl: "1800"
      external-dns.kubernetes.io/webhook-comment: "k8s_managed"
      external-dns.kubernetes.io/webhook-match-subdomain: "true"
      external-dns.kubernetes.io/webhook-disabled: "false"
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 80
        targetPort: *port
persistence:
  config:
    enabled: true
    storageClass: ceph-filesystem
    accessMode: ReadWriteOnce
    size: 20Gi
    advancedMounts:
      readarr:
        app:
          - path: /config
  library:
    enabled: true
    type: hostPath
    hostPathType: Directory
    hostPath: /library
    advancedMounts:
      readarr:
        app:
          - path: /library
  tmp:
    type: emptyDir
    advancedMounts:
      readarr:
        app:
          - path: /tmp
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      readarr:
        tailscale:
          - path: /tmp/tailscale
  tailscale-serve-config:
    enabled: true
    type: configMap
    name: tailscale-serve
    advancedMounts:
      readarr:
        tailscale:
          - path: /etc/tailscale
            readOnly: true
