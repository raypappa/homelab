---
pod:
  nodeSelector:
    kubernetes.io/hostname: puma
defaultPodOptions:
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 1001
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/whisparr
          # renovate: datasource=docker depName=ghcr.io/hotio/whisparr
          tag: latest
          pullPolicy: IfNotPresent
        env:
          WHISPARR__INSTANCE_NAME: Whisparr
          WHISPARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: whisparr-secret
                key: api_key
          WHISPARR__AUTHENTICATION_METHOD: External
          WHISPARR__AUTHENTICATION_REQUIRED: DisabledForLocalAddresses
          WHISPARR__LOG__LEVEL: info
          WHISPARR__PORT: &port 6969
          WHISPARR__UPDATE__BRANCH: develop
          TZ: UTC
          PUID: 1001
          PGID: 1001
          UMASK: "022"
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=whisparr"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
          TS_SERVE_CONFIG: "/etc/tailscale/serve-config.json"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: *port
persistence:
  config:
    enabled: true
    storageClass: ceph-filesystem
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      main:
        main:
          - path: /config
  library:
    enabled: true
    type: hostPath
    hostPathType: Directory
    hostPath: /library
    advancedMounts:
      main:
        main:
          - path: /library
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      main:
        tailscale:
          - path: /tmp/tailscale
  tailscale-serve-config:
    enabled: true
    type: configMap
    name: tailscale-serve
    advancedMounts:
      main:
        tailscale:
          - path: /etc/tailscale
            readOnly: true
