---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/values.schema.json
controllers:
  sonarr:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      nodeSelector:
        kubernetes.io/hostname: puma
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups:
          - 65542 # gladius:external-services
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/sonarr
          # renovate: datasource=docker depName=ghcr.io/home-operations/sonarr
          tag: 4.0.19
        env:
          COMPlus_EnableDiagnostics: "0"
          SONARR__APP__INSTANCENAME: Sonarr
          SONARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: sonarr-secret
                key: api_key
          SONARR__AUTH__METHOD: External
          SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
          SONARR__LOG__LEVEL: info
          SONARR__SERVER__PORT: &port 8989
          SONARR__UPDATE__BRANCH: develop
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 384Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.102.2
          pullPolicy: IfNotPresent
        env:
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                name: tailscale-auth
                key: TS_AUTHKEY
          TS_EXTRA_ARGS: "--login-server=https://weasel.stoneydavis.com --hostname=sonarr"
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_STATE_DIR: "/tmp/tailscale/state"
          TS_SOCKET: "/tmp/tailscale/run/tailscaled.sock"
          TS_SERVE_CONFIG: "/etc/tailscale/serve-config.json"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
service:
  app:
    controller: sonarr
    ports:
      http:
        port: *port
persistence:
  config:
    existingClaim: sonarr-config
    advancedMounts:
      sonarr:
        app:
          - path: /config
  add-ons:
    type: emptyDir
    advancedMounts:
      sonarr:
        app:
          - path: /add-ons
  tmp:
    type: emptyDir
    advancedMounts:
      sonarr:
        app:
          - path: /tmp
  media:
    enabled: true
    type: hostPath
    hostPathType: Directory
    hostPath: /library
    advancedMounts:
      sonarr:
        app:
          - path: /library
  tailscale-state:
    enabled: true
    type: emptyDir
    sizeLimit: 128Mi
    advancedMounts:
      sonarr:
        tailscale:
          - path: /tmp/tailscale
  tailscale-serve-config:
    enabled: true
    type: configMap
    name: tailscale-serve
    advancedMounts:
      sonarr:
        tailscale:
          - path: /etc/tailscale
            readOnly: true
