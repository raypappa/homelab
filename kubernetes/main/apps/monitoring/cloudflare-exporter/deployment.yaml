---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-exporter
  labels:
    app.kubernetes.io/name: cloudflare-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-exporter
          image: ghcr.io/lablabs/cloudflare_exporter:0.2.3@sha256:6bf84a81725c6d75b14fb584135ccfe5f8aff89d23c36b04511d22b1c6cc10cb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN
              value: ":8080"
            - name: METRICS_PATH
              value: /metrics
            - name: SCRAPE_INTERVAL
              value: "60"
            - name: CF_ZONES
              value: REPLACE_WITH_ZONE_ID
            - name: CF_TIMEOUT
              value: 10s
            - name: ENABLE_PPROF
              value: "false"
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-exporter-credentials
                  key: CF_API_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
