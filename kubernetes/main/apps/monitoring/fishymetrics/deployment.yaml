---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishymetrics
  labels:
    app.kubernetes.io/name: fishymetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fishymetrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishymetrics
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fishymetrics
          image: docker.io/comcast/fishymetrics:0.20.0@sha256:492647f08d26e00bb7781f213c0105c58c9b8a4b110442a7809ea1791023e015
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10023
              protocol: TCP
          env:
            - name: EXPORTER_PORT
              value: "10023"
            - name: BMC_SCHEME
              value: https
            - name: BMC_TIMEOUT
              value: 15s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
