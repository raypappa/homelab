---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mktxp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mktxp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 49090
  egress:
    - to:
        - ipBlock:
            cidr: 10.49.48.1/32
        - ipBlock:
            cidr: 10.49.48.2/32
        - ipBlock:
            cidr: 10.49.48.7/32
        - ipBlock:
            cidr: 10.49.48.8/32
        - ipBlock:
            cidr: 10.49.48.3/32
        - ipBlock:
            cidr: 10.49.48.20/32
      ports:
        - protocol: TCP
          port: 8729
