---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - service.yaml
  - service-monitor.yaml
  - network-policy.yaml
configMapGenerator:
  - name: mktxp-config
    files:
      - mktxp.conf
      - _mktxp.conf
generatorOptions:
  disableNameSuffixHash: true
