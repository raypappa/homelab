---
deploymentMode: Monolithic
gateway:
  enabled: true
  replicas: 1
loki:
  analytics:
    reporting_enabled: false
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    working_directory: /var/loki/compactor/retention
    delete_request_store: filesystem
    retention_enabled: true
  ingester:
    chunk_encoding: snappy
  limits_config:
    retention_period: 336h
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  server:
    log_level: info
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
monitoring:
  serviceMonitor:
    enabled: true
    interval: 1m
  rules:
    enabled: false
  alerts:
    enabled: false
lokiCanary:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 50Gi
    whenScaled: Retain
    whenDeleted: Retain
test:
  enabled: false
