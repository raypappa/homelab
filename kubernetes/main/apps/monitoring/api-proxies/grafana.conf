server {
  listen 8080;
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path /tmp/proxy_temp;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  client_max_body_size 1m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Grafana read endpoints. The caller supplies a Viewer token using
  # X-Grafana-Authorization; it is not logged or forwarded under that name.
  location = /api/health {
    limit_except GET { deny all; }
    proxy_pass http://grafana.monitoring.svc.cluster.local:80;
    proxy_set_header Authorization $http_x_grafana_authorization;
    proxy_set_header X-Grafana-Authorization "";
    proxy_read_timeout 30s;
  }

  location = /api/search {
    limit_except GET { deny all; }
    proxy_pass http://grafana.monitoring.svc.cluster.local:80;
    proxy_set_header Authorization $http_x_grafana_authorization;
    proxy_set_header X-Grafana-Authorization "";
    proxy_read_timeout 30s;
  }

  location ~ ^/api/dashboards/uid/[A-Za-z0-9_-]+$ {
    limit_except GET { deny all; }
    proxy_pass http://grafana.monitoring.svc.cluster.local:80;
    proxy_set_header Authorization $http_x_grafana_authorization;
    proxy_set_header X-Grafana-Authorization "";
    proxy_read_timeout 30s;
  }

  location = /api/folders {
    limit_except GET { deny all; }
    proxy_pass http://grafana.monitoring.svc.cluster.local:80;
    proxy_set_header Authorization $http_x_grafana_authorization;
    proxy_set_header X-Grafana-Authorization "";
    proxy_read_timeout 30s;
  }

  location ~ ^/api/folders/([A-Za-z0-9_-]+)$ {
    limit_except GET { deny all; }
    proxy_pass http://grafana.monitoring.svc.cluster.local:80;
    proxy_set_header Authorization $http_x_grafana_authorization;
    proxy_set_header X-Grafana-Authorization "";
    proxy_read_timeout 30s;
  }

  location = /api/datasources {
    limit_except GET { deny all; }
    proxy_pass http://grafana.monitoring.svc.cluster.local:80;
    proxy_set_header Authorization $http_x_grafana_authorization;
    proxy_set_header X-Grafana-Authorization "";
    proxy_read_timeout 30s;
  }

  # Grafana's datasource query API is POST-only but read-only under Viewer.
  location = /api/ds/query {
    limit_except POST { deny all; }
    proxy_pass http://grafana.monitoring.svc.cluster.local:80;
    proxy_set_header Authorization $http_x_grafana_authorization;
    proxy_set_header X-Grafana-Authorization "";
    proxy_read_timeout 30s;
  }

  location / {
    return 404;
  }
}
