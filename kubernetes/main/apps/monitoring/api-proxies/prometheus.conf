server {
  listen 8080;
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path /tmp/proxy_temp;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  client_max_body_size 1m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Read-only Prometheus API endpoints. All other paths and methods are denied.
  location ~ ^/api/v1/(query|query_range|targets|labels|series|metadata|status/buildinfo|status/runtimeinfo)$ {
    limit_except GET { deny all; }
    proxy_pass http://prometheus-operated.monitoring.svc.cluster.local:9090;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
  }

  location ~ ^/api/v1/label/[A-Za-z_][A-Za-z0-9_]*/values$ {
    limit_except GET { deny all; }
    proxy_pass http://prometheus-operated.monitoring.svc.cluster.local:9090;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
  }

  location / {
    return 404;
  }
}
