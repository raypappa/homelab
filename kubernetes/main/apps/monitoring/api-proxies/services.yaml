---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-query-proxy
  labels:
    app.kubernetes.io/name: monitoring-api-proxies
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monitoring-api-proxies
  ports:
    - name: http
      port: 8080
      targetPort: prometheus-http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-query-proxy
  labels:
    app.kubernetes.io/name: monitoring-api-proxies
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monitoring-api-proxies
  ports:
    - name: http
      port: 8080
      targetPort: grafana-http
      protocol: TCP
