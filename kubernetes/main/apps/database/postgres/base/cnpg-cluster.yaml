---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: faerun-cnpg-001
spec:
  instances: 1

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.4-1.1.1

  storage:
    size: 10Gi

  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
      - "vchord.so"
