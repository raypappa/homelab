---
# vim: filetype=ansible.yaml
- name: Enable IPv4 forwarding
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
- name: Enable IPv6 forwarding
  become: true
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    reload: true
  when: ansible_all_ipv6_addresses | length > 0
- name: Ensure undesired packages are not installed
  become: true
  ansible.builtin.apt:
    pkg:
      - docker.io
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: absent
- name: Get debian architecture
  ansible.builtin.command: dpkg --print-architecture
  register: headscale_debian_arch
  changed_when: false
  failed_when: false
  check_mode: false
- name: Set debian Arch fact
  ansible.builtin.set_fact:
    cacheable: true
    headscale_dpkg_architecture: >-
      {{ headscale_debian_arch.stdout | trim | default('amd64', true)
         | regex_replace('x86_64', 'amd64')
         | regex_replace('aarch64', 'arm64') }}
- name: Create headscale config directory
  become: true
  ansible.builtin.file:
    path: "/etc/headscale"
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install required packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    autoclean: true
    state: latest
    pkg:
      - curl
      - ca-certificates
- name: Install headscale deb package
  become: true
  become_flags: '-' # https://github.com/ansible/ansible/issues/45219
  ansible.builtin.apt:
    deb: https://github.com/juanfont/headscale/releases/download/v{{ headscale_version
      }}/headscale_{{ headscale_version }}_linux_{{ headscale_dpkg_architecture }}.deb
- name: Add headscale config
  become: true
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/etc/headscale/config.yaml"
    owner: headscale
    group: headscale
    mode: '0600'
- name: Deploy headscale ACL policy
  become: true
  ansible.builtin.copy:
    src: policy.json
    dest: /etc/headscale/policy.json
    owner: headscale
    group: headscale
    mode: '0600'
  notify: Restart headscale
- name: Enable headscale systemd service
  become: true
  ansible.builtin.systemd_service:
    name: headscale.service
    enabled: true
    daemon_reload: true
    state: started
- name: Create Headscale user
  block:
    - name: Create headscale user
      register: headscale_user_create
      ansible.builtin.command:
        cmd: headscale users create -o json homelab
      changed_when: false
      failed_when:
        - headscale_user_create.rc != 0
        - '"UNIQUE constraint failed: users.name" not in (headscale_user_create.stderr
          | default(""))'
    - name: Get headscale user id
      ansible.builtin.command:
        cmd: headscale users list -o json -n homelab
      register: headscale_user_info
      changed_when: false
    - name: Set Headscale user ID fact
      ansible.builtin.set_fact:
        headscale_user_id: "{{ headscale_user_info.stdout | from_json | first | json_query('id')
          }}"
