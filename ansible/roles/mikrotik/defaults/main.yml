---
# defaults/main.yml — mikrotik role
#
# Per-device overrides happen in host_vars/<device>.yaml.

# SSH connection
mikrotik_ssh_user: raypappa
mikrotik_ssh_port: 2200
mikrotik_ssh_key: ~/.ssh/raypappa

# Public key to install (file is in this role's files/keys/raypappa.pub).
# Override per-device if you need a different key.
mikrotik_ssh_public_key_file: raypappa.pub

# Source management subnet (for the SSH source-restriction firewall rule)
mikrotik_mgmt_subnet: 10.49.48.0/23

# .rsc files to apply. The role uploads everything in
# files/<inventory_hostname>/ to the device, then imports each one in
# alphabetical order. To skip a device, leave its directory empty (or
# don't list the host in the inventory).
mikrotik_apply_files: "{{ lookup('fileglob', role_path ~ '/files/' ~ inventory_hostname ~ '/*.rsc', wantlist=True) | sort }}"

# Should the SSH baseline be applied? Set to false after first run, or
# if you manage SSH out-of-band.
mikrotik_apply_ssh_baseline: true
