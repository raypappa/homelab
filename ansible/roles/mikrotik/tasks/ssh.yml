---
# tasks/ssh.yml — apply the SSH baseline
#
# For a one-time bootstrap, run with -e ansible_password=<admin-password>.
# After the first run, the role is a no-op (the user is already
# publickey-only, the key is already imported, services are on the new
# port).
#
# Idempotency: the script does an `:if ([:len $existing] = 0)` check
# before importing the key, and all `set` operations are by name. Safe
# to re-run.

- name: Mikrotik SSH | upload the public key file to the device
  community.routeros.command:
    commands:
      - /file remove [find name=raypappa.pub]
      - /file add name=raypappa.pub contents="{{ lookup('file', role_path ~ '/files/keys/' ~ mikrotik_ssh_public_key_file) }}"
  changed_when: true
  when: mikrotik_apply_ssh_baseline | bool

- name: "Mikrotik SSH | apply ssh-config.rsc (idempotent: services, port, user, FW)"
  community.routeros.command:
    commands: /import file=ssh-config.rsc
  changed_when: true
  when: mikrotik_apply_ssh_baseline | bool
  # No notify: RouterOS has no "restart ssh" — the /import on the running
  # SSH service is enough. Changes to ssh-config.rsc take effect on the
  # next connection.

- name: Mikrotik SSH | verify SSH service is up
  community.routeros.command:
    commands: /ip ssh print
  register: mikrotik_ssh_state
  changed_when: false
  when: mikrotik_apply_ssh_baseline | bool
