---
- name: Install SSL certificate from cert-manager
  tags:
    - ssl
  block:
    - name: Read cert-manager TLS Secret from Kubernetes
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secret
          - puma.stoneydavis.com-tls
          - --namespace=cert-manager
          - --output=json
      changed_when: false
      delegate_to: localhost
      no_log: true
      register: ssl_kubernetes_secret
      run_once: true
    - name: Decode cert-manager TLS Secret
      ansible.builtin.set_fact:
        ssl_certificate_fullchain: "{{ (ssl_kubernetes_secret.stdout | from_json).data['tls.crt']
          | b64decode }}"
        ssl_certificate_private_key: "{{ (ssl_kubernetes_secret.stdout | from_json).data['tls.key']
          | b64decode }}"
      no_log: true
    - name: Verify cert-manager Secret contains a full chain and private key
      ansible.builtin.assert:
        that:
          - ssl_certificate_fullchain is string
          - ssl_certificate_fullchain | trim | length > 0
          - ssl_certificate_private_key is string
          - ssl_certificate_private_key | trim | length > 0
        fail_msg: "cert-manager TLS Secret must contain tls.crt and tls.key."
      no_log: true
    - name: Parse cert-manager certificate
      community.crypto.x509_certificate_info:
        content: "{{ ssl_certificate_fullchain }}"
        valid_at:
          two_weeks: "+2w"
      register: ssl_certificate_info
      no_log: true
    - name: Parse cert-manager private key
      community.crypto.openssl_privatekey_info:
        content: "{{ ssl_certificate_private_key }}"
      register: ssl_private_key_info
      no_log: true
    - name: Verify cert-manager certificate matches its private key
      ansible.builtin.assert:
        that:
          - ssl_private_key_info.public_key_fingerprints == ssl_certificate_info.public_key_fingerprints
        fail_msg: "cert-manager certificate and private key do not match."
      no_log: true
    - name: Report that Panda certificate installation is waiting for wildcard issuance
      ansible.builtin.debug:
        msg: "Not installing the certificate: cert-manager must issue a valid apex
          and wildcard certificate first."
      when: >-
        not ssl_certificate_info.valid_at.two_weeks
        or 'DNS:puma.stoneydavis.com' not in (ssl_certificate_info.subject_alt_name
        | default([]))
        or 'DNS:*.puma.stoneydavis.com' not in (ssl_certificate_info.subject_alt_name
        | default([]))
    - name: Install verified certificate on Panda
      when:
        - ssl_certificate_info.valid_at.two_weeks
        - "'DNS:puma.stoneydavis.com' in (ssl_certificate_info.subject_alt_name |
          default([]))"
        - "'DNS:*.puma.stoneydavis.com' in (ssl_certificate_info.subject_alt_name
          | default([]))"
      block:
        - name: Create SSL directory
          ansible.builtin.file:
            path: /etc/ssl/game.puma.stoneydavis.com
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true
        - name: Install SSL full chain
          ansible.builtin.copy:
            content: "{{ ssl_certificate_fullchain }}"
            dest: /etc/ssl/game.puma.stoneydavis.com/fullchain.pem
            owner: root
            group: root
            mode: "0644"
          become: true
          no_log: true
          notify:
            - restart-apache
            - restart-pterodactyl-wings
        - name: Install SSL private key
          ansible.builtin.copy:
            content: "{{ ssl_certificate_private_key }}"
            dest: /etc/ssl/game.puma.stoneydavis.com/privkey.pem
            owner: root
            group: root
            mode: "0600"
          become: true
          no_log: true
          notify:
            - restart-apache
            - restart-pterodactyl-wings
- name: MariaDB
  ansible.builtin.include_role:
    name: xolyu.mariadb
  vars:
    mariadb_ensure_requirements: true
    mariadb_databases:
      - name: "{{ pterodactyl_mysql_db_name }}"
    mariadb_users:
      - name: "{{ pterodactyl_mysql_db_user }}"
        password: "{{ pterodactyl_mysql_db_password }}"
        priv: "{{ pterodactyl_mysql_db_name }}.*:ALL"
- name: Install Pterodactyl
  block:
    - name: Install Pterodactyl Panel
      register: pterodactyl_panel_role
      ansible.builtin.include_role:
        name: maxhoesel.pterodactyl.pterodactyl_panel
      vars:
        pterodactyl_panel_domain: "{{ game_server_domain }}"
        pterodactyl_panel_url: https://{{ game_server_domain }}
        pterodactyl_panel_app_key: "{{ lookup('amazon.aws.aws_secret', 'faerun-pterodactyl.app-key',
          nested=true, region=lookup('env', 'AWS_REGION')) }}"
        pterodactyl_panel_hashids_salt: "{{ lookup('amazon.aws.aws_secret', 'faerun-pterodactyl.panel-salt',
          nested=true, region=lookup('env', 'AWS_REGION')) }}"
        pterodactyl_panel_db_host: 127.0.0.1
        pterodactyl_panel_db_name: "{{ pterodactyl_mysql_db_name }}"
        pterodactyl_panel_db_user: "{{ pterodactyl_mysql_db_user }}"
        pterodactyl_panel_db_password: "{{ pterodactyl_mysql_db_password }}"
        pterodactyl_panel_ssl_mode: none
        pterodactyl_panel_ssl_cert: /etc/ssl/game.puma.stoneydavis.com/fullchain.pem
        pterodactyl_panel_ssl_key: /etc/ssl/game.puma.stoneydavis.com/privkey.pem
        pterodactyl_panel_timezone: America/Los_Angeles
        pterodactyl_panel_admin_mail: "{{ lookup('amazon.aws.aws_secret', 'pterodactyl-panel-admin.email',
          nested=true, region=lookup('env', 'AWS_REGION')) }}"
        pterodactyl_panel_admin_user: "{{ lookup('amazon.aws.aws_secret', 'pterodactyl-panel-admin.user',
          nested=true, region=lookup('env', 'AWS_REGION')) }}"
        pterodactyl_panel_admin_password: "{{ lookup('amazon.aws.aws_secret', 'pterodactyl-panel-admin.password',
          nested=true, region=lookup('env', 'AWS_REGION')) }}"
    - name: Create docker network
      community.docker.docker_network:
        name: pterodactyl_nw
        state: present
        ipam_config:
          - subnet: 172.19.0.0/16
            gateway: 172.19.0.1
    - name: Install Pterodactyl Wings Daemon
      ansible.builtin.include_role:
        name: maxhoesel.pterodactyl.pterodactyl_wings
      # pterodactyl_wings supports additional options, see it's README for more details.
      vars:
        # The role's docker install uses apt_key, which Debian 13 (trixie) no longer ships.
        # Docker is already installed on panda.
        pterodactyl_wings_docker_install: false
        pterodactyl_wings_config:
          uuid: "{{ pterodactyl_wings_panel_uuid }}"
          token_id: "{{ pterodactyl_wings_panel_token_id }}"
          token: "{{ pterodactyl_wings_panel_token }}"
          api:
            host: 0.0.0.0 # Address to bind the wings daemon to
            port: 8443 # Port to bind the wings daemon to
            ssl:
              enabled: true
              cert: /etc/ssl/game.puma.stoneydavis.com/fullchain.pem
              key: /etc/ssl/game.puma.stoneydavis.com/privkey.pem
          system:
            sftp:
              bind_address: 0.0.0.0
              port: 2022
          remote: http://127.0.0.1:80
          allowed_origins:
            - https://game.fieldsofbears.com
            - https://172.17.42.155
