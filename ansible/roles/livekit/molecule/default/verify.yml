---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: 5

    - name: Check LiveKit service is running
      ansible.builtin.service_facts:

    - name: Assert LiveKit service is active
      ansible.builtin.assert:
        that:
          - "'livekit-server.service' in ansible_facts.services"
          - "ansible_facts.services['livekit-server.service'].state == 'running'"
        fail_msg: "LiveKit service is not running"
        success_msg: "LiveKit service is running"

    - name: Check LiveKit config file exists
      ansible.builtin.stat:
        path: /etc/livekit-server.yaml
      register: config_file

    - name: Assert config file exists
      ansible.builtin.assert:
        that:
          - config_file.stat.exists
          - config_file.stat.mode == '0644'
        fail_msg: "LiveKit config file missing or wrong permissions"
        success_msg: "LiveKit config file exists with correct permissions"

    - name: Check LiveKit binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/livekit-server
      register: livekit_binary

    - name: Assert LiveKit binary exists
      ansible.builtin.assert:
        that:
          - livekit_binary.stat.exists
          - livekit_binary.stat.executable
        fail_msg: "LiveKit binary not found or not executable"
        success_msg: "LiveKit binary exists and is executable"

    - name: Check livekit-jwt service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/livekit-jwt.service
      register: jwt_service_file

    - name: Assert livekit-jwt service file exists and is configured
      ansible.builtin.assert:
        that:
          - jwt_service_file.stat.exists
        fail_msg: "livekit-jwt service file not found"
        success_msg: "livekit-jwt service file exists"

    - name: Read livekit-jwt service file
      ansible.builtin.slurp:
        src: /etc/systemd/system/livekit-jwt.service
      register: jwt_service_content

    - name: Assert livekit-jwt service has correct configuration
      ansible.builtin.assert:
        that:
          - "'LIVEKIT_URL=ws://localhost:7880' in (jwt_service_content.content | b64decode)"
          - "'/usr/local/bin/livekit-jwt' in (jwt_service_content.content | b64decode)"
        fail_msg: "livekit-jwt service has incorrect configuration"
        success_msg: "livekit-jwt service is correctly configured"

    - name: Check nginx is running
      ansible.builtin.service_facts:

    - name: Assert nginx service is active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service'].state == 'running'"
        fail_msg: "nginx service is not running"
        success_msg: "nginx service is running"

    - name: Test LiveKit API endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ livekit_config.port | default(7880) }}"
        status_code:
          - 200
          - 404
        timeout: 5
      register: livekit_health
      ignore_errors: true

    - name: Verify LiveKit API is accessible
      ansible.builtin.assert:
        that:
          - livekit_health.status in [200, 404]
        fail_msg: "LiveKit API is not accessible"
        success_msg: "LiveKit API is accessible"
      when: livekit_health is not failed
