---
- name: Converge
  hosts: all
  become: true
  vars:
    livekit_jwt_scheme: ws
    certbot_certs:
      - name: localhost
    livekit_config:
      port: 7880
      bind_addresses:
        - ""
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 60000
        use_external_ip: false
        enable_loopback_candidate: false
      redis:
        address: localhost:6379
        username: ""
        password: ""
        db: 0
        use_tls: false
        sentinel_master_name: ""
        sentinel_username: ""
        sentinel_password: ""
        sentinel_addresses: []
        cluster_addresses: []
        max_redirects: null
      turn:
        enabled: false
        domain: livekit.example.com
        cert_file: /etc/ssl/certs/ssl-cert-snakeoil.pem
        key_file: /etc/ssl/private/ssl-cert-snakeoil.key
      keys:
        devkey: secret
  roles:
    - role: livekit
