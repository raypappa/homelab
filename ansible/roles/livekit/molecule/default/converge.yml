# SPDX-License-Identifier: MIT-0
---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Create letsencrypt group
      ansible.builtin.group:
        name: letsencrypt
        state: present
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
  vars:
    certbot_certs:
      - name: test.example.com
    livekit_config:
      port: 7880
      bind_addresses:
        - ""
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 60000
        use_external_ip: false
        enable_loopback_candidate: false
      redis:
        address: localhost:6379
        username: ""
        password: ""
        db: 0
        use_tls: false
        sentinel_master_name: ""
        sentinel_username: ""
        sentinel_password: ""
        sentinel_addresses: []
        cluster_addresses: []
        max_redirects: null
      turn:
        enabled: false
      keys:
        devkey: secret
  roles:
    - role: livekit
