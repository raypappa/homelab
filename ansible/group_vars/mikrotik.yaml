---
# group_vars/mikrotik.yaml — applied to every device in the `mikrotik:` group.
# These override `all` (which sets ansible_connection: ssh and ansible_user: root
# for the SSH-based Linux hosts). The `all` group vars are not appropriate for
# network devices.
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: community.routeros.routeros
ansible_user: raypappa
ansible_ssh_port: 2200
ansible_ssh_private_key_file: ~/.ssh/raypappa
ansible_command_timeout: 30

# Bastion / jump host support.
#
# When BASTION_HOST, BASTION_PORT, and BASTION_USER are all set in the
# environment, the role adds a ProxyCommand so ansible.netcommon.network_cli
# and the scp upload both reach the device through the bastion. When
# they're unset, the role runs direct.
#
# This matches the PROXY_ARGS / CI_ARGS pattern in
# .taskfiles/ansible/Taskfile.yaml, so the same env vars you pass to
# `task deploy:ci` reach the Mikrotik role too.
mikrotik_bastion_enabled: >-
  {{ lookup('env', 'BASTION_HOST') | length > 0
     and lookup('env', 'BASTION_PORT') | length > 0
     and lookup('env', 'BASTION_USER') | length > 0 }}
mikrotik_ssh_proxy_command: >-
  {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
     ~ ' -o ConnectionAttempts=1 -o ConnectTimeout=2'
     ~ ' -p ' ~ lookup('env', 'BASTION_PORT')
     ~ ' -W %h:%p -q'
     ~ ' ' ~ lookup('env', 'BASTION_USER')
     ~ '@' ~ lookup('env', 'BASTION_HOST')
     if mikrotik_bastion_enabled | bool else '' }}
ansible_ssh_common_args: >-
  {{ '-o ProxyCommand="' ~ mikrotik_ssh_proxy_command ~ '"'
     if mikrotik_bastion_enabled | bool else '' }}
