---
ci:
  autofix_prs: true
  autoupdate_branch: bugfix/pre-commit-fixes
  skip:
    - local-biome-check
minimum_pre_commit_version: 2.13.0
repos:
  - hooks:
      - id: commitizen
      - id: commitizen-branch
        stages:
          - pre-push
    repo: https://github.com/commitizen-tools/commitizen
    rev: 0c47f153e36705819b4d819508fa913d979c1ccc # frozen: v4.19.3
  - hooks:
      - id: no-commit-to-branch
      - id: check-json
      - id: check-json
        files: "config.json.disabled"
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe # required for cfn or yaml with custom import (!)
      - id: trailing-whitespace
        exclude: ".*.yaml"
      - id: check-symlinks
      - id: check-builtin-literals
      - id: check-ast
      - id: check-added-large-files
      - id: debug-statements
      - id: mixed-line-ending
      - id: requirements-txt-fixer
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
  - hooks:
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-dependabot
      - id: check-taskfile
      - id: check-renovate
        additional_dependencies:
          - "json5"
    repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 39478bf2c099a58683d3f1aedf675105318b078d # frozen: 0.39.0
  - hooks:
      - additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-toc
          - mdformat-config
        id: mdformat
    repo: https://github.com/executablebooks/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0 # frozen: 1.0.0
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f6467e1f1ebecf5020560405c7b26e01786a43c8 # frozen: v10.4.0
    hooks:
      - id: cspell
  - hooks:
      - id: yamlfmt
        exclude: pnpm-lock\.yaml$
    repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        exclude: '(\.github/workflows|pnpm-lock\.yaml$)'
        args:
          - --no-warnings
  - repo: local
    hooks:
      - id: local-biome-check
        name: biome check
        entry: npx  --package @biomejs/biome biome check --write --files-ignore-unknown=true
          --no-errors-on-unmatched
        language: system
        types:
          - text
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css)$"
        verbose: true
      - id: local-config-change
        name: config.json check
        pass_filenames: false
        entry: scripts/dependency_graph.py
        additional_dependencies:
          - pyyaml
        language: python
        types:
          - json
        files: "config\\.json(\\.disabled)?"
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 46787482b9fb2003c56e0f7592e312ef381829d9 # frozen: 0.13.6
    hooks:
      - id: uv-lock
